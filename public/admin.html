<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Bouton Saison</title>
    <style>
        body { font-family: Arial; padding: 50px; text-align: center; }
        button { padding: 15px 30px; background: #4CAF50; color: white; border: none; font-size: 16px; cursor: pointer; }
        select { padding: 10px; font-size: 16px; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔄 Changer la saison active</h1>
    <select id="saison">
        <option value="2025-2026">2025-2026</option>
        <option value="2026-2027" selected>2026-2027</option>
        <option value="2027-2028">2027-2028</option>
    </select>
    <br><br>
    <button onclick="changeSaison()">✅ Basculer vers cette saison</button>
    <div id="result"></div>

    <script>
        async function changeSaison() {
            const saison = document.getElementById('saison').value;
            const token = prompt("Colle ici ton token admin (récupéré via /api/login) :");
            if (!token) return;

            document.getElementById('result').textContent = "Chargement...";

            try {
                const response = await fetch('/api/saisons/current', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `saison=${saison}&token=${token}`
                });
                const data = await response.json();
                document.getElementById('result').textContent =
                    response.ok ? `✅ Saison changée en ${saison} !` : `❌ Erreur : ${data.detail || 'Vérifie ton token'}`;
            } catch (error) {
                document.getElementById('result').textContent = `❌ Erreur réseau : ${error}`;
            }
        }
    </script>
</body>
</html>
